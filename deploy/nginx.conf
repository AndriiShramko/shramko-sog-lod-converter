# sog.flyreelstudio.eu - the PLY to Shramko SOG LOD Converter: a static release (the converter runs in the
# visitor's browser) plus a tiny /api proxy (feedback, reports, counters, health).
#
# Mounted read-only into sog-web as /etc/nginx/conf.d/default.conf (a single-file bind mount of
# $SOG_BASE/nginx.conf). deploy.sh refuses to switch a release while the hub's copy, or the copy
# sog-web actually sees, differs from this file; `bash deploy/deploy.sh --sync-config` tests it in a
# throwaway container, writes it in place and reloads (deploy/README.md, "Changing nginx.conf").
#
# Rules this file keeps:
# - add_header inside a location drops every add_header inherited from the server level, so EVERY
#   location repeats the full security header block (the values live in the maps below, once).
# - The API is reached through a variable (proxy_pass $api_upstream...): nginx then resolves
#   "sog-api" per request through Docker's DNS, so `nginx -t` passes without the API container and a
#   recreated API container (new address) is found again within 10 s.
# - Regexes that contain { } must be quoted, or nginx reads the brace as a block.
# - No inline <script> is allowed by the CSP: every script of the web app is a file under 'self'.

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm application/manifest+json image/svg+xml application/xml text/xml;

# nginx's mime.types knows .js, .json and .wasm (application/wasm) but not .mjs; module scripts are
# refused by browsers when served as application/octet-stream. This block adds to mime.types.
types {
    application/javascript mjs;
}

# requests to /api/*: generous per-visitor ceiling in front of the API's own limits, so a flood
# stops here instead of in the 64 MB API container (keyed by the real client address, see below)
limit_req_zone $binary_remote_addr zone=sog_api:1m rate=10r/s;
limit_req_status 429;

# nginx fixes the map hash bucket size when it parses the FIRST map, so this line must stay above
# every map (the CSP value is a long string)
map_hash_bucket_size 128;

# language for "/": the remembered choice (cookie sog_lang, set by the web app's language switch)
# wins over the browser's first Accept-Language entry; anything else gets English
map $http_accept_language $sog_browser_lang {
    default en;
    "~*^\s*es" es;
    "~*^\s*pl" pl;
    "~*^\s*(ru|uk|be)" ru;
}
map $cookie_sog_lang $sog_cookie_lang {
    default "";
    "~^(en|es|pl|ru)$" $1;
}
map "$sog_cookie_lang:$sog_browser_lang" $sog_lang {
    default $sog_browser_lang;
    "~^(?<c>en|es|pl|ru):" $c;
}

# Header values, written once (a map with only a default is a constant). Enforced CSP: scripts only
# from this origin (+ Google Tag Manager for GA4), WebAssembly allowed ('wasm-unsafe-eval'), workers
# from this origin or blob:, no framing. No COOP/COEP: the converter needs no SharedArrayBuffer.
map $uri $sog_csp {
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.googletagmanager.com; worker-src 'self' blob:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}
map $uri $sog_permissions {
    default "screen-wake-lock=(self), camera=(), microphone=(), geolocation=(), usb=(), serial=(), bluetooth=(), payment=()";
}

server {
    listen 80;
    server_name sog.flyreelstudio.eu;
    root /srv/releases/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    # relative Location headers (/pl/): behind nginx-proxy an absolute redirect would name this
    # container's own scheme and port (http, 80) instead of the visitor's
    absolute_redirect off;

    # Docker's embedded DNS: the API container is looked up per request (cached 10 s)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api_upstream http://sog-api:8090;

    # The client address. nginx-proxy (a private address on web-proxy) appends the visitor's address
    # to X-Forwarded-For; reading from the right and skipping trusted (private) hops lands on that
    # appended address, so a value the visitor writes into the header himself is never used.
    # The API gets exactly this one address in X-Real-IP and X-Forwarded-For.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    error_page 404 /404.html;

    # liveness for the compose healthcheck and the deploy scripts (no file system access)
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sog_permissions always;
        add_header Content-Security-Policy $sog_csp always;
        return 200 "ok\n";
    }

    # dotfiles (.git, .env, .DS_Store ...) never leave the server, wherever they sit
    location ~ "/\.(?!well-known/)" {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sog_permissions always;
        add_header Content-Security-Policy $sog_csp always;
        return 404;
    }

    # "/" -> /en/ /es/ /pl/ /ru/ (cookie first, then Accept-Language); the query string goes along
    location = / {
        add_header Cache-Control "no-cache" always;
        add_header Vary "Cookie, Accept-Language" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sog_permissions always;
        add_header Content-Security-Policy $sog_csp always;
        return 302 /$sog_lang/$is_args$args;
    }

    # /en -> /en/ (one canonical address per page)
    location ~ "^/(en|es|pl|ru)$" {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sog_permissions always;
        add_header Content-Security-Policy $sog_csp always;
        return 301 /$1/$is_args$args;
    }

    # WebAssembly anywhere: always application/wasm (streaming compilation needs it), cached for a
    # year. The file name must change with its content (Vite's hashed assets), like /assets/.
    location ~ "\.wasm$" {
        types { }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sog_permissions always;
        add_header Content-Security-Policy $sog_csp always;
        try_files $uri =404;
    }

    # the locale pages: index.html of each locale directory, never cached without revalidation
    location ~ "^/(en|es|pl|ru)/" {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sog_permissions always;
        add_header Content-Security-Policy $sog_csp always;
        try_files $uri $uri/ =404;
    }

    # hashed build output: the name changes with the content, so cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sog_permissions always;
        add_header Content-Security-Policy $sog_csp always;
        try_files $uri =404;
    }

    # which release is live (written by deploy.sh); the deploy and rollback scripts read it back
    location = /release.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sog_permissions always;
        add_header Content-Security-Policy $sog_csp always;
        try_files $uri =404;
    }

    # everything else of the release (favicon, robots.txt, sitemap.xml, 404.html, images)
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sog_permissions always;
        add_header Content-Security-Policy $sog_csp always;
        try_files $uri $uri/ =404;
    }

    # ---- API (sog-api on the internal network only). Every proxied request carries the real client
    # address in X-Real-IP and X-Forwarded-For (never the visitor's own header), no cookies and no
    # credentials. Responses are never cached.

    # bug reports and ideas; a bug may carry diagnostics (the visitor's consent), the only large body
    location = /api/report {
        limit_except POST { deny all; }
        limit_req zone=sog_api burst=20 nodelay;
        client_max_body_size 512k;
        proxy_pass $api_upstream/api/report;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sog_permissions always;
        add_header Content-Security-Policy $sog_csp always;
    }

    # the contact / collaboration form
    location = /api/lead {
        limit_except POST { deny all; }
        limit_req zone=sog_api burst=20 nodelay;
        client_max_body_size 8k;
        proxy_pass $api_upstream/api/lead;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sog_permissions always;
        add_header Content-Security-Policy $sog_csp always;
    }

    # the cookieless first-party event counter
    location = /api/e {
        limit_except POST { deny all; }
        limit_req zone=sog_api burst=20 nodelay;
        client_max_body_size 8k;
        proxy_pass $api_upstream/api/e;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sog_permissions always;
        add_header Content-Security-Policy $sog_csp always;
    }

    location = /api/health {
        limit_except GET { deny all; }
        proxy_pass $api_upstream/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sog_permissions always;
        add_header Content-Security-Policy $sog_csp always;
    }

    # aggregated counters for the owner: only from inside sog-web itself
    # (docker exec sog-web wget -qO- http://127.0.0.1/api/stats). $realip_remote_addr is the address
    # of the TCP peer before the real-IP module: a forged X-Forwarded-For: 127.0.0.1 that came in
    # through the proxy does not pass.
    location = /api/stats {
        allow 127.0.0.1;
        deny all;
        if ($realip_remote_addr != "127.0.0.1") {
            return 403;
        }
        limit_except GET { deny all; }
        proxy_pass $api_upstream/api/stats;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sog_permissions always;
        add_header Content-Security-Policy $sog_csp always;
    }

    # any other /api/ path: a JSON 404 from here, never the static site and never the API
    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy $sog_permissions always;
        add_header Content-Security-Policy $sog_csp always;
        return 404 "{\"ok\":false}\n";
    }
}
